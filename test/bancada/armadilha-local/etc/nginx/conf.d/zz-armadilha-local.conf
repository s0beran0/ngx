# Armadilha do glob.
#
# Este arquivo existe no disco LOCAL, com o mesmo nome de diretorio que a
# bancada usa dentro do container. Se o `Glob` do parser nao estiver injetado
# com o sistema de arquivos remoto, `include /etc/nginx/conf.d/*.conf` resolve
# contra a maquina de quem rodou o ngx e este arquivo entra na arvore.
#
# O marcador abaixo nunca pode aparecer numa configuracao efetiva lida da
# bancada. O smoke test verifica isso.
server {
    listen 9999;
    server_name armadilha-local-nao-deve-aparecer;

    location / {
        return 200 "ARMADILHA-LOCAL-NAO-DEVE-APARECER\n";
    }
}
