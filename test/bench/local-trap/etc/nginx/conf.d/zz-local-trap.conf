# The glob trap.
#
# This file exists on the LOCAL disk, under the same directory name the bench
# uses inside the container. If the parser's `Glob` is not injected with the
# remote filesystem, `include /etc/nginx/conf.d/*.conf` resolves against the
# machine of whoever ran ngx and this file enters the tree.
#
# The marker below must never appear in an effective configuration read from
# the bench. The smoke test verifies this.
server {
    listen 9999;
    server_name local-trap-must-not-appear;

    location / {
        return 200 "LOCAL-TRAP-MUST-NOT-APPEAR\n";
    }
}
