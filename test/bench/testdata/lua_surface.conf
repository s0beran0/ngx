# Superficie de sintaxe Lua: o que um *_by_lua_block pode conter e que a
# leitura como configuracao nginx quebraria. E o par de syntax_surface.conf,
# separado dele porque o nginx padrao nao tem lua-nginx-module e recusaria o
# arquivo inteiro como diretiva desconhecida.
#
# Validado por OpenResty de verdade na suite de integracao. Se voce acrescentar
# uma construcao aqui, rode `make bench-lua-up && go test -tags integration
# ./test/bench/` antes de supor que e valida: o oraculo e o binario, nao a
# nossa leitura dele.
events { worker_connections 1024; }

http {
    # Corpo Lua com `if`, `;` e chaves dentro de string, e uma tabela cujas
    # chaves usam `;` como separador -- tudo isso lido como configuracao viraria
    # diretiva malformada.
    init_by_lua_block {
        local cfg = { limite = 10; nome = "a; b { c }" }
        if cfg.limite > 0 then
            cfg.ativo = true
        end
    }

    # Diretiva comum DEPOIS do bloco: e aqui que o alinhamento quebra se o
    # nosso fluxo de tokens dessincronizar do fluxo do crossplane.
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name lua.example.com;

        # O unico *_by_lua_block com argumento ANTES do corpo.
        set_by_lua_block $marca {
            local partes = { "x", "y" }
            if #partes > 1 then return "dois; { itens }" end
            return "um"
        }
        add_header X-Marca $marca;

        location /rewrite {
            rewrite_by_lua_block {
                if ngx.var.arg_x == nil then
                    ngx.req.set_uri("/conteudo")
                end
            }
            return 204;
        }

        location /conteudo {
            content_by_lua_block {
                local msg = "corpo; com { chaves } e ponto-virgula"
                if ngx.var.request_method == "GET" then
                    ngx.say(msg)
                else
                    ngx.exit(405)
                end
            }
            # Outra diretiva depois do bloco, agora aninhada.
            access_log off;
        }

        # Bloco de uma linha so.
        location /curto {
            content_by_lua_block { ngx.say("ok; {1}") }
            access_log off;
        }
    }
}
