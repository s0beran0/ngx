events {}

http {
    server {
        listen 443 ssl;
        server_name api.exemplo.com;
        ssl_certificate_key /etc/ssl/private/api.key;

        location / {
            proxy_pass http://backend;
        }

        location /health {
            access_log off;
        }
    }

    upstream backend {
        server 10.0.0.1:8080;
    }
}
