server {
    listen 80;
    server_name portal.example.com;
    return 301 https://portal.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name portal.example.com;
    ssl_certificate_key /etc/ssl/private/portal.key;

    location / {
        proxy_pass http://portal_backend;
    }
}
