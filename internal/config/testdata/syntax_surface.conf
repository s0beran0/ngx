# comentario de linha inteira
events { worker_connections 1024; }   # comentario no fim da linha

http {
    # aspas duplas com ; e { } dentro
    add_header X-One "value; with { braces } and semicolon";
    # aspas simples
    add_header X-Two 'another; value';
    # escape de aspas dentro de aspas
    add_header X-Tres "com \"aspas\" escapadas";
    # cifrao literal escapado e variaveis nas duas formas
    add_header X-Quatro "variaveis $host e ${host}";

    # unidades de tamanho e tempo
    client_max_body_size 10m;
    keepalive_timeout    1h30m;
    client_body_timeout  100ms;

    # bloco vazio
    upstream naovazio { server 127.0.0.1:8080; }
    types {}

    # map com chave regex, aspas e default
    map $http_user_agent $ehbot {
        default          0;
        "~*bot|crawler"  1;
        ""               0;
        \d+              2;
    }

    server {
        listen 8443;
        server_name a.example.com b.example.com;

        # location em todas as formas
        location = /exato { return 200; }
        location ^~ /prefixo { return 200; }
        location ~ \.php$ { return 200; }
        location ~* \.(JPG|png)$ { return 200; }
        location @nomeada { return 404; }
        location /com\ espaco { return 200; }

        # if com varios operadores
        if ($request_method = POST) { return 405; }
        if ($http_user_agent ~* "bot") { return 403; }
        if (!-f $request_filename) { return 404; }
        if ($arg_x != "") { return 400; }

        # return com codigo e texto entre aspas
        location /texto { return 200 "corpo; com ponto-virgula"; }

        # aninhamento profundo
        location /a { location /a/b { return 200; } }
    }
}

