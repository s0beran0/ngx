# configuracao de exemplo
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    upstream backend_v1 {
        server 10.0.0.1:8080;
    }

    server {
        listen 443 ssl;
        server_name api.exemplo.com;

        ssl_certificate_key /etc/ssl/private/api.key;

        location / {
            proxy_pass http://backend_v1;
        }

        location /api {
            proxy_pass http://backend_v1;
            add_header X-A "b; c";
        }
    }
}
