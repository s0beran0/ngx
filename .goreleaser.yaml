# Goreleaser configuration for ngx.
#
# The release is triggered by a tag (see .github/workflows/release.yml). The
# channel comes out of the semver itself (DD1): "v0.2.0" is stable,
# "v0.2.0-rc.1" is a pre-release. There is no release branch to keep in sync.
version: 2
project_name: ngx

before:
  hooks:
    - go mod tidy

# WHY THERE IS MORE THAN ONE BUILD HERE (DC1)
#
# `ldflags` belong to a build, and every artifact made out of that build sees
# the same values. The install channel is per ARTIFACT, not per build: the
# tarball is "direct", the .deb is "deb", the .rpm is "rpm", the .apk is "apk".
# Putting `-X ...InstallChannel=` in a single shared build would stamp the same
# channel on all four, which is the exact bug this variable exists to prevent.
#
# goreleaser offers no per-package ldflags: `nfpms` picks up already-linked
# binaries through `ids`, and `builds[].overrides` only discriminates by
# goos/goarch/goamd64/goarm -- and deb, rpm and apk all share linux/amd64 and
# linux/arm64. So the channel has to be decided at link time, which means one
# build per channel.
#
# The cost is real and is paid on every release: the packaged builds add
# 3 channels x 2 linux arches = 6 compilations to the 6 the archives already
# need. Twelve instead of six. goreleaser runs them in parallel, and a
# CGO-free Go binary of this size links in seconds, so the wall-clock cost on
# the release runner is under a minute.
#
# The shared ldflags are YAML anchors on purpose. Repeating them by hand is how
# a packaged build silently loses the embedded public key while the tarball
# keeps it -- and per DD6 a wrong `-X` reports nothing.
builds:
  # The archives build. Six platforms, and NO InstallChannel flag: the default
  # in the code is already "direct", which is exactly what a tarball unpacked
  # by install.sh, or a plain `go build ./cmd/ngx`, is. Anything else would
  # only restate the default.
  - id: ngx
    main: &ngx_main ./cmd/ngx
    binary: &ngx_binary ngx
    env: &ngx_env
      # Static binary, no cgo. Same rule as CI: a dependency that required
      # cgo would break the cross-compile of the six platforms. It is also
      # what lets the same linux binary go into the .apk: Alpine has musl and
      # no glibc, and a cgo build would not run there.
      - CGO_ENABLED=0
    flags: &ngx_flags
      # Strips the build machine's path out of the binary: without it the same
      # commit produces different binaries depending on the runner's directory.
      - -trimpath
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: &ngx_mod_timestamp "{{ .CommitTimestamp }}"
    ldflags:
      - &ldflag_strip -s -w
      - &ldflag_version -X github.com/s0beran0/ngx/internal/output.Version={{ .Version }}
      # ATTENTION: THIS IS WHERE THE PUBLIC KEY GETS EMBEDDED (DD3).
      #
      # The minisign public key enters here, at build time, and is never
      # downloaded at run time -- a key that "ngx update" fetches from the
      # network itself protects against nothing, because whoever controls the
      # server hands over their own key along with their own binary.
      #
      # The value comes from the repository variable NGX_PUBLIC_KEY (a
      # variable, not a secret: a public key is public by definition). The
      # empty default is deliberate and only valid for a local/snapshot build:
      # a binary with no key makes "ngx update" refuse to update, instead of
      # accepting without verification. On a release, the workflow aborts
      # before compiling if the variable is empty -- a release with no embedded
      # key would be worse than no release at all.
      #
      # The symbol is internal/update.PublicKey, which is what `ngx update`
      # actually consults. Pointing it anywhere else would raise no error: the
      # linker ignores -X against a non-existent symbol, the build passes and
      # the binary ships with no key. That is what almost happened -- the
      # original target was internal/output.PublicKey, which does not exist and
      # would have read nothing.
      - &ldflag_pubkey -X github.com/s0beran0/ngx/internal/update.PublicKey={{ envOrDefault "NGX_PUBLIC_KEY" "" }}

  # The three packaged builds. Only linux, only the two arches nfpm ships:
  # compiling darwin or windows here would produce binaries nothing consumes.
  #
  # The `-X ...InstallChannel=` line is the ONLY difference between them and
  # the build above. It is also the line that fails in silence if the symbol
  # ever moves: `-X` against a name the linker does not find is ignored, the
  # build succeeds, and the package ships claiming "direct" -- a .deb that
  # happily overwrites itself under dpkg's feet. The release workflow proves
  # each of these channels reaches a running binary before publishing anything
  # (DD6); do not delete that step.
  - id: ngx-deb
    main: *ngx_main
    binary: *ngx_binary
    env: *ngx_env
    flags: *ngx_flags
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: *ngx_mod_timestamp
    ldflags:
      - *ldflag_strip
      - *ldflag_version
      - *ldflag_pubkey
      - -X github.com/s0beran0/ngx/internal/update.InstallChannel=deb

  - id: ngx-rpm
    main: *ngx_main
    binary: *ngx_binary
    env: *ngx_env
    flags: *ngx_flags
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: *ngx_mod_timestamp
    ldflags:
      - *ldflag_strip
      - *ldflag_version
      - *ldflag_pubkey
      - -X github.com/s0beran0/ngx/internal/update.InstallChannel=rpm

  # "apk" is a known channel in internal/update.upgradeCommands, so this
  # package refuses through the packaged-channel branch (NGX-0316) and names
  # `apk upgrade ngx`. It used to fall through the unknown-channel branch
  # (NGX-0317), which refused for the right reason with the wrong message.
  - id: ngx-apk
    main: *ngx_main
    binary: *ngx_binary
    env: *ngx_env
    flags: *ngx_flags
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: *ngx_mod_timestamp
    ldflags:
      - *ldflag_strip
      - *ldflag_version
      - *ldflag_pubkey
      - -X github.com/s0beran0/ngx/internal/update.InstallChannel=apk

  # The four self-service channel builds (DC3). Same reason as the packaged
  # builds above: brew, scoop, winget and the AUR all consume an ARCHIVE, and
  # an archive carries whatever channel was linked into the binary it wraps.
  # Pointing all four at the generic `ngx` archive would publish four package
  # managers' worth of binaries that answer "direct" and happily overwrite
  # themselves behind the manager that installed them.
  #
  # So each channel gets its own build and its own archive. The extra cost is
  # 8 more compilations and 8 more files on the release page; the alternative
  # is the bug DC1 exists to prevent.
  - id: ngx-homebrew
    main: *ngx_main
    binary: *ngx_binary
    env: *ngx_env
    flags: *ngx_flags
    # darwin only. A Homebrew CASK is macOS-only by definition -- Homebrew on
    # Linux does not install casks -- and a cask is what goreleaser publishes
    # now that `brews` (formula) is deprecated. Building linux here would
    # produce a tarball no formula references.
    goos: [darwin]
    goarch: [amd64, arm64]
    mod_timestamp: *ngx_mod_timestamp
    ldflags:
      - *ldflag_strip
      - *ldflag_version
      - *ldflag_pubkey
      - -X github.com/s0beran0/ngx/internal/update.InstallChannel=homebrew

  - id: ngx-scoop
    main: *ngx_main
    binary: *ngx_binary
    env: *ngx_env
    flags: *ngx_flags
    goos: [windows]
    goarch: [amd64, arm64]
    mod_timestamp: *ngx_mod_timestamp
    ldflags:
      - *ldflag_strip
      - *ldflag_version
      - *ldflag_pubkey
      - -X github.com/s0beran0/ngx/internal/update.InstallChannel=scoop

  # scoop and winget are BOTH windows/amd64+arm64 and differ only in the
  # channel string, which is exactly the case `builds[].overrides` cannot
  # express: it discriminates by goos/goarch and these two share both.
  - id: ngx-winget
    main: *ngx_main
    binary: *ngx_binary
    env: *ngx_env
    flags: *ngx_flags
    goos: [windows]
    goarch: [amd64, arm64]
    mod_timestamp: *ngx_mod_timestamp
    ldflags:
      - *ldflag_strip
      - *ldflag_version
      - *ldflag_pubkey
      - -X github.com/s0beran0/ngx/internal/update.InstallChannel=winget

  - id: ngx-aur
    main: *ngx_main
    binary: *ngx_binary
    env: *ngx_env
    flags: *ngx_flags
    # The AUR package is a -bin package: it repacks the released tarball, so
    # it needs the same platforms the AUR itself supports for this project.
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: *ngx_mod_timestamp
    ldflags:
      - *ldflag_strip
      - *ldflag_version
      - *ldflag_pubkey
      - -X github.com/s0beran0/ngx/internal/update.InstallChannel=aur

archives:
  - id: ngx
    # Without this, the archives would also wrap the three packaged builds and
    # publish tarballs whose binary refuses to self-update.
    ids: [ngx]
    formats: [tar.gz]
    # Windows gets .zip: it is what the platform opens with no extra tool, and
    # what install.ps1 expects.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      # A file listed here that does not exist in the repository makes
      # goreleaser abort. Hence only the LICENSE for now: add README.md to this
      # list once the file exists at the root.
      - LICENSE

  # THE CHANNEL SUFFIX GOES AFTER THE ARCHITECTURE, AND THAT IS NOT COSMETIC.
  #
  # `ngx update` finds its download with internal/update.AssetForPlatform,
  # which matches by SUFFIX -- "_<goos>_<goarch>.tar.gz" / ".zip" -- so that
  # the name template can change without rewriting the updater. A channel
  # archive named "ngx-homebrew_1.2.3_darwin_arm64.tar.gz" would end in
  # "_darwin_arm64.tar.gz" and could be handed to a `curl | sh` user, whose
  # binary would then be a homebrew binary that REFUSES to update itself --
  # on a machine with no brew. Keeping the channel last makes the suffix
  # "_darwin_arm64_homebrew.tar.gz", which matches nothing the updater looks
  # for, and leaves the generic tarball the only answer for a direct install.
  - id: homebrew
    ids: [ngx-homebrew]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_homebrew"
    files: &channel_files
      - LICENSE

  - id: scoop
    ids: [ngx-scoop]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_scoop"
    files: *channel_files

  - id: winget
    ids: [ngx-winget]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_winget"
    files: *channel_files

  - id: aur
    ids: [ngx-aur]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_aur"
    files: *channel_files

# One entry per format, because each one consumes a different build. Merging
# them into a single entry with `formats: [deb, rpm, apk]` is what the examples
# show and is wrong here: that entry has one `ids`, so all three packages would
# come from the same binary and carry the same channel.
nfpms:
  - id: deb
    ids: [ngx-deb]
    formats: [deb]
    package_name: &pkg_name ngx
    vendor: &pkg_vendor Eduardo Benck
    homepage: &pkg_homepage https://github.com/s0beran0/ngx
    maintainer: &pkg_maintainer "Eduardo Benck <89141425+s0beran0@users.noreply.github.com>"
    description: &pkg_description |-
      nginx CLI with structured output.
      ngx reads and reports nginx configuration as JSON when stdout is not a
      terminal and as readable text when it is, so the same tool serves scripts,
      AI agents and people.
    license: &pkg_license MIT
    # /usr/bin, not /usr/local/bin: a package manager owns /usr, and
    # /usr/local is reserved for what the administrator installs by hand.
    bindir: &pkg_bindir /usr/bin
    section: &pkg_section utils
    priority: &pkg_priority optional
    contents: &pkg_contents
      - src: LICENSE
        dst: /usr/share/doc/ngx/LICENSE

  - id: rpm
    ids: [ngx-rpm]
    formats: [rpm]
    package_name: *pkg_name
    vendor: *pkg_vendor
    homepage: *pkg_homepage
    maintainer: *pkg_maintainer
    description: *pkg_description
    license: *pkg_license
    bindir: *pkg_bindir
    section: *pkg_section
    priority: *pkg_priority
    contents: *pkg_contents

  - id: apk
    ids: [ngx-apk]
    formats: [apk]
    package_name: *pkg_name
    vendor: *pkg_vendor
    homepage: *pkg_homepage
    maintainer: *pkg_maintainer
    description: *pkg_description
    license: *pkg_license
    bindir: *pkg_bindir
    section: *pkg_section
    priority: *pkg_priority
    contents: *pkg_contents

# THE SELF-SERVICE CHANNELS (DC3)
#
# All four publish into a repository that is NOT this one, and that is the
# single fact that shapes every `token:` below: `secrets.GITHUB_TOKEN` is
# minted for this repository and reaches nothing else. Each destination needs
# its own credential, supplied as a repository secret, and the exact steps to
# create them are in docs/install-channels.md.
#
# `goreleaser check` DOES NOT VALIDATE THESE TEMPLATES. Measured: replacing
# `ne` with a function that does not exist leaves the check green. So a broken
# skip_upload would first be discovered while publishing -- the same shape of
# silent failure as `-ldflags -X` against a missing symbol (DD6), where the
# tool that was supposed to object stays quiet.
#
# The guard below was therefore proven by running it, not by checking it: with
# the repository on the stable tag v0.1.1, `.Prerelease` renders empty, and on
# a local tag v9.9.9-rc.1 it renders `rc.1`. Both were observed by rendering
# the field into an archive name, which goreleaser really does evaluate.
#
# A PRE-RELEASE PUBLISHES TO NONE OF THESE. `.Prerelease` is non-empty for a
# tag like v1.2.3-rc.1, and every skip_upload below refuses on it. Without that
# clause a release candidate reaches `brew install` and `scoop install` as if
# it were stable, and opens a pull request against microsoft/winget-pkgs, which
# does not accept pre-releases. The GitHub release itself is still published
# and still marked as a pre-release (see `prerelease: auto`), which is what the
# beta channel is for -- what stops is the self-service package managers, where
# a user asking for `ngx` is asking for the stable one.
#
# A MISSING CREDENTIAL DOES NOT FAIL THE RELEASE. `skip_upload` reads the
# environment: with no token the artifact is still built and the manifest is
# still generated under dist/, it just is not pushed. Failing the release
# instead would mean no release at all until an AUR account exists -- and the
# tarballs, the packages and the signature have nothing to do with the AUR.
# The workflow prints which channels are live and which were skipped, so a
# skipped channel is loud rather than silent.

homebrew_casks:
  # A CASK, NOT A FORMULA. goreleaser 2.17 marks `brews` deprecated and
  # `goreleaser check` fails on it; Homebrew itself now routes pre-compiled
  # binaries to casks and homebrew-core rejects a formula that only drops a
  # binary in place. The cost is that casks are macOS-only -- Homebrew on
  # Linux does not install them -- so a Linux user takes install.sh, the
  # .deb/.rpm/.apk or the AUR.
  #
  # The repository is `homebrew-tap` and NOT `tap`: brew strips the
  # "homebrew-" prefix, which is what turns it into
  # `brew install s0beran0/tap/ngx`.
  - name: ngx
    ids: [homebrew]
    binaries: [ngx]
    repository:
      owner: s0beran0
      name: homebrew-tap
      branch: main
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    skip_upload: '{{ if or (eq (envOrDefault "HOMEBREW_TAP_TOKEN" "") "") (ne .Prerelease "") }}true{{ else }}false{{ end }}'
    homepage: *pkg_homepage
    # One line, no leading article, does not start with the cask name: those
    # are `brew audit` rules, and a tap that fails audit is a tap nobody can
    # promote later.
    description: &channel_description "nginx CLI with structured output for agents and humans"
    license: *pkg_license
    commit_author: &channel_commit_author
      name: Eduardo Benck
      email: 89141425+s0beran0@users.noreply.github.com
    commit_msg_template: "ngx {{ .Tag }}"
    # WITHOUT THIS THE CASK INSTALLS A BINARY macOS REFUSES TO RUN.
    #
    # ngx is not signed with an Apple Developer ID and not notarized, so
    # Gatekeeper quarantines anything a cask downloads and the first `ngx`
    # dies with "cannot be opened because the developer cannot be verified".
    # Stripping the quarantine attribute at install time is the documented
    # workaround for an unsigned cask; the `xattr -h` guard keeps it from
    # breaking on a system where xattr is missing.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ngx"]
          end

scoops:
  # The bucket is a repository of its own -- s0beran0/scoop-bucket -- which
  # does not exist yet. Until it does, and until SCOOP_BUCKET_TOKEN is set,
  # this generates the manifest under dist/ and pushes nothing.
  - name: ngx
    ids: [scoop]
    repository:
      owner: s0beran0
      name: scoop-bucket
      branch: main
      token: '{{ envOrDefault "SCOOP_BUCKET_TOKEN" "" }}'
    skip_upload: '{{ if or (eq (envOrDefault "SCOOP_BUCKET_TOKEN" "") "") (ne .Prerelease "") }}true{{ else }}false{{ end }}'
    homepage: *pkg_homepage
    description: *channel_description
    license: *pkg_license
    commit_author: *channel_commit_author
    commit_msg_template: "ngx {{ .Tag }}"

winget:
  # WINGET IS THE ONE CHANNEL THAT IS NOT SELF-SERVICE.
  #
  # goreleaser writes the manifest and opens a pull request against
  # microsoft/winget-pkgs; Microsoft's automated validation then runs and a
  # human moderator merges. So the release does not "publish to winget", it
  # REQUESTS publication. Anything downstream that treats a green release as
  # "ngx is on winget" is wrong.
  #
  # The PR has to come from a fork owned by us, because a pull request cannot
  # be opened from a branch of a repository we cannot push to.
  - name: ngx
    ids: [winget]
    # Publisher.Package, and the publisher is the account that publishes:
    # s0beran0. Deriving it from a legal name put the maintainer's name in
    # the install command every Windows user would type.
    package_identifier: s0beran0.ngx
    publisher: s0beran0
    publisher_url: https://github.com/s0beran0
    publisher_support_url: https://github.com/s0beran0/ngx/issues
    author: s0beran0
    short_description: *channel_description
    description: |
      ngx reads and reports nginx configuration as JSON when stdout is not a
      terminal and as readable text when it is, so the same tool serves
      scripts, AI agents and people.
    homepage: *pkg_homepage
    license: *pkg_license
    license_url: https://github.com/s0beran0/ngx/blob/main/LICENSE
    copyright: s0beran0
    tags:
      - nginx
      - cli
      - json
      - devops
    skip_upload: '{{ if or (eq (envOrDefault "WINGET_PKGS_TOKEN" "") "") (ne .Prerelease "") }}true{{ else }}false{{ end }}'
    commit_author: *channel_commit_author
    commit_msg_template: "New version: s0beran0.ngx version {{ .Version }}"
    repository:
      owner: s0beran0
      name: winget-pkgs
      branch: "ngx-{{ .Version }}"
      token: '{{ envOrDefault "WINGET_PKGS_TOKEN" "" }}'
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

aurs:
  # The AUR is not GitHub: it is a git server that authenticates with SSH
  # only, so this one needs an SSH private key and not a token. The account
  # and the package name have to be registered on aur.archlinux.org first --
  # pushing to a package nobody owns creates it, pushing to one someone else
  # owns is rejected.
  #
  # The name ends in -bin because the package ships a compiled binary instead
  # of building from source; that is an AUR naming rule, not a preference.
  - name: ngx-bin
    ids: [aur]
    homepage: *pkg_homepage
    description: *channel_description
    license: *pkg_license
    maintainers:
      - "Eduardo Benck <89141425+s0beran0@users.noreply.github.com>"
    provides:
      - ngx
    conflicts:
      - ngx
    private_key: '{{ envOrDefault "AUR_SSH_KEY" "" }}'
    git_url: "ssh://aur@aur.archlinux.org/ngx-bin.git"
    skip_upload: '{{ if or (eq (envOrDefault "AUR_SSH_KEY" "") "") (ne .Prerelease "") }}true{{ else }}false{{ end }}'
    commit_author: *channel_commit_author
    commit_msg_template: "ngx {{ .Tag }}"
    package: |-
      install -Dm755 "./ngx" "${pkgdir}/usr/bin/ngx"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/ngx-bin/LICENSE"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Signing checksums.txt alone is enough: it covers every artifact by hash, so
# one signature protects the whole set (DD2). That now includes the .deb, .rpm
# and .apk, which is why they need no per-format signing key of their own.
#
# The private key lives outside GitHub and reaches the runner as a secret; the
# path of the temporary file comes in MINISIGN_KEY_FILE and the password in
# MINISIGN_PASSWORD, delivered over stdin because minisign does not read the
# password from an environment variable.
signs:
  - id: minisign
    cmd: minisign
    args:
      - -S
      - -s
      - "{{ .Env.MINISIGN_KEY_FILE }}"
      - -m
      - "${artifact}"
      - -x
      - "${signature}"
    signature: "${artifact}.minisig"
    artifacts: checksum
    stdin: "{{ .Env.MINISIGN_PASSWORD }}"

release:
  # Marks the release as a pre-release when the tag carries a pre-release
  # suffix (-beta, -rc, -alpha). It is what separates the beta channel from the
  # stable channel (DD1).
  prerelease: auto
  draft: false
  # The header carries what a changelog of commit subjects cannot: the shape of
  # the output changed, and a consumer that never reads schema_version has no
  # other way to find out. "It was in the schema version" is not a defence for
  # silence.
  header: |
    ## What changed for anyone reading the output

    `schema_version` is still `1`: nothing in the envelope's SHAPE was removed
    or renamed. Two behaviours changed, and one column did.

    - **A node now carries `ref`, and `ref` is what names it.** An `id` is
      unique within its FILE, not within the configuration: IDs count siblings
      from the root of the file they live in, so on the `conf.d/*.conf` layout
      every distribution ships, the first directive of every file is `s0.d0`.
      Measured against a 133-file production configuration: `--directive
      listen` returned **324 matches carrying 23 distinct ids** — an average of
      fourteen nodes answering to the same name. The same query now returns 324
      distinct `ref`s. `ref` is `"<file>#<id>"`, it is assigned once and never
      reassigned, and it is what v0.2 will target.

    - **`get --format table` has one `ref` column where it had `id` and
      `file`.** This is the one break: a script reading those two columns has
      to read one. It is also cheaper, since `ref` already contains the file,
      so printing both meant printing the file twice per row. JSON is additive
      — `id`, `file` and `ref` are all present.

    - **Lua blocks are delimited by Lua's rules.** ngx no longer uses the
      dependency's Lua lexer, which counted braces outside `'` and `"` and
      knew nothing else. Verified against OpenResty 1.27.1.2: four
      configurations that ngx used to REFUSE and the server accepts now parse
      (an escaped quote `'a\'b'`, an escaped `"a\"b"`, a long bracket
      `[[ } ]]`, a comment `-- }`), and one that ngx used to ACCEPT and the
      server refuses is now refused — `content_by_lua_block { -- }`, where the
      comment swallows the closing brace. That last one is why this release
      exists: ngx was describing a structure the running server never had, with
      nothing in the output saying so.

      Reported upstream as nginxinc/nginx-go-crossplane#179, with reproductions
      and an offer to patch. The workaround is not waiting on it.

    - **A comment's text no longer carries carriage returns.** `# a\rb` used to
      come out as `" a\rb"`; a CR there is noise in what a reader consumes.

    Still read-only. Mutation is v0.2, and both prerequisites that were blocking
    it are closed: this is the last release before that work starts.

  footer: |
    ---

    ### Verifying the download

    The artifacts are covered by `checksums.txt`, and `checksums.txt` is signed
    with minisign. The public key is versioned in the repository, in
    `ngx-minisign.pub`, and it is the same one embedded in the binary.

    ```sh
    minisign -Vm checksums.txt -p ngx-minisign.pub
    sha256sum --ignore-missing -c checksums.txt
    ```

    ### Installing from a package manager

    ```sh
    dpkg -i ngx_*_linux_amd64.deb        # Debian, Ubuntu
    rpm -i ngx_*_linux_amd64.rpm         # Fedora, RHEL
    apk add --allow-untrusted ngx_*.apk  # Alpine
    ```

    Homebrew, Scoop, WinGet and the AUR are built by this release and **not
    published to** — their artifacts and manifests exist, the upload is skipped,
    and the job summary names each one. They are waiting on the project being
    accepted by those registries, not on anything in this repository. Until then
    take a package above, a tarball, or `install.sh`.

    A packaged binary knows it was installed by a package manager, so `ngx
    update` refuses to replace itself and points at the command that belongs to
    that manager — `brew upgrade ngx`, `apt upgrade ngx`, `scoop update ngx`.
    Only the tarballs and `install.sh` self-update. `ngx version` reports which
    channel it came from, in `install_channel`.

    The archives ending in `_homebrew`, `_scoop`, `_winget` and `_aur` exist
    for those package managers and carry that refusal. Downloading one by hand
    gets you a binary that will not update itself; the plain
    `ngx_<version>_<os>_<arch>` archive is the one to take.

    See `docs/install-channels.md`.

