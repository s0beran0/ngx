name: check credentials

# Proves that the publishing credentials can do what a release needs, WITHOUT
# publishing anything.
#
# This exists because a secret cannot be inspected. A token with the wrong
# scope, pointed at the wrong repository, or expired last week, is
# indistinguishable in the secrets list from a correct one -- and the release
# workflow treats every one of them the same way: a credential that does not
# work makes the channel skip, and the release still goes out green. So the
# failure mode is not a red build, it is a channel that quietly stops being
# updated.
#
# Run it by hand from the Actions tab before a release, or after rotating a
# token.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Each check writes its verdict to the job summary and keeps going, so
      # one broken token does not hide the state of the other two.
      - name: probe every publishing credential
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -u
          failures=0

          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          say "## Publishing credentials"
          say ""

          # Can this token WRITE to this repository?
          #
          # The read side is `permissions.push` on the repository object, which
          # a fine-grained token only reports as true when it actually carries
          # Contents: write. But that is the API describing itself, so it is
          # confirmed by doing the thing: create a ref and delete it. A ref
          # that can be created is a file that can be committed, which is all
          # the release ever does to these repositories.
          check_write() {
            channel="$1"; repo="$2"; token="$3"; secret="$4"

            if [ -z "$token" ]; then
              say "- **$channel** — secret \`$secret\` is not set, channel will skip"
              return
            fi

            code=$(curl -s -o /tmp/repo.json -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo")
            case "$code" in
              200) : ;;
              401) say "- **$channel** — FAIL: \`$secret\` is rejected (401). Expired, revoked, or mistyped."; failures=$((failures+1)); return ;;
              404) say "- **$channel** — FAIL: \`$secret\` cannot see \`$repo\` (404). A fine-grained token scoped to other repositories reports 404, not 403."; failures=$((failures+1)); return ;;
              *)   say "- **$channel** — FAIL: unexpected HTTP $code reading \`$repo\`."; failures=$((failures+1)); return ;;
            esac

            if [ "$(jq -r '.permissions.push // false' /tmp/repo.json)" != "true" ]; then
              say "- **$channel** — FAIL: \`$secret\` reaches \`$repo\` but has no write access. Add **Contents: Read and write**."
              failures=$((failures+1)); return
            fi

            branch=$(jq -r '.default_branch' /tmp/repo.json)
            sha=$(curl -s -H "Authorization: Bearer $token" \
              "https://api.github.com/repos/$repo/git/ref/heads/$branch" | jq -r '.object.sha // empty')
            if [ -z "$sha" ]; then
              say "- **$channel** — FAIL: \`$repo\` has no commit on \`$branch\`, so there is no ref to push against. Add a README to create one."
              failures=$((failures+1)); return
            fi

            probe="refs/heads/credential-check-${GITHUB_RUN_ID}"
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/git/refs" \
              -d "{\"ref\":\"$probe\",\"sha\":\"$sha\"}")
            if [ "$code" != "201" ]; then
              say "- **$channel** — FAIL: write was refused in practice (HTTP $code creating a branch), even though the API claimed write access."
              failures=$((failures+1)); return
            fi
            curl -s -o /dev/null -X DELETE \
              -H "Authorization: Bearer $token" \
              "https://api.github.com/repos/$repo/git/$probe"

            say "- **$channel** — ok: writes to \`$repo\` (branch created and removed)"
          }

          check_write "Homebrew tap" "s0beran0/homebrew-tap" "$HOMEBREW_TAP_TOKEN" HOMEBREW_TAP_TOKEN
          check_write "Scoop bucket" "s0beran0/scoop-bucket" "$SCOOP_BUCKET_TOKEN" SCOOP_BUCKET_TOKEN
          check_write "WinGet fork"  "s0beran0/winget-pkgs"  "$WINGET_PKGS_TOKEN"  WINGET_PKGS_TOKEN

          # WinGet needs a second permission the others do not: opening a pull
          # request against microsoft/winget-pkgs.
          #
          # It is probed WITHOUT opening one, by asking for a pull request that
          # cannot exist -- master onto master, no commits between them. The
          # answer separates the two cases cleanly: 403 means the token may not
          # open pull requests, while 422 means it may, and the request was
          # merely invalid. Nothing is created on either path, which is what
          # makes this safe to run against somebody else's repository.
          if [ -n "$WINGET_PKGS_TOKEN" ]; then
            code=$(curl -s -o /tmp/pr.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $WINGET_PKGS_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/microsoft/winget-pkgs/pulls" \
              -d '{"title":"credential check, not to be merged","head":"master","base":"master"}')
            case "$code" in
              422) say "- **WinGet pull requests** — ok: the token may open pull requests (the request was rejected as invalid, not as forbidden)" ;;
              403) say "- **WinGet pull requests** — FAIL: forbidden. Add **Pull requests: Read and write** to \`WINGET_PKGS_TOKEN\`."; failures=$((failures+1)) ;;
              201) say "- **WinGet pull requests** — a pull request was actually created, which should be impossible. CLOSE IT BY HAND: $(jq -r '.html_url' /tmp/pr.json)"; failures=$((failures+1)) ;;
              *)   say "- **WinGet pull requests** — FAIL: unexpected HTTP $code."; failures=$((failures+1)) ;;
            esac
          fi

          if [ -z "${AUR_SSH_KEY:-}" ]; then
            say "- **AUR** — no key set; registration is closed upstream (docs/install-channels.md)"
          else
            say "- **AUR** — key present, not probed here: it authenticates over SSH to a host outside GitHub"
          fi

          say ""
          if [ "$failures" -gt 0 ]; then
            say "**$failures credential(s) would fail silently at release time.**"
            exit 1
          fi
          say "Every credential present can do what the release needs."
