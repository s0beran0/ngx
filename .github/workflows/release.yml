name: release

# The channel comes out of the tag's semver, not the branch (DD1): "v0.2.0"
# publishes stable, "v0.2.0-rc.1" publishes a pre-release. What decides is
# goreleaser, with prerelease: auto.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Two tags pushed together must not run in parallel: both would run
# "release --clean" against the same remote repository. The previous run is
# NOT cancelled here -- cancelling a release midway leaves the GitHub release
# half-published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # goreleaser needs the whole history and the tags to build the
          # changelog and work out the version.
          fetch-depth: 0

      # The version comes from .tool-versions, the same file CI and asdf use.
      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: true

      # Everything that might be missing is checked BEFORE compiling or
      # publishing anything. A release that goes up half-way and then fails to
      # be signed forces deleting the release by hand.
      - name: check the secrets and the public key
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          NGX_PUBLIC_KEY: ${{ vars.NGX_PUBLIC_KEY }}
        run: |
          missing=""
          [ -n "$MINISIGN_KEY" ] || missing="$missing secrets.MINISIGN_KEY"
          [ -n "$MINISIGN_PASSWORD" ] || missing="$missing secrets.MINISIGN_PASSWORD"
          [ -n "$NGX_PUBLIC_KEY" ] || missing="$missing vars.NGX_PUBLIC_KEY"
          if [ -n "$missing" ]; then
            echo "error: missing from the repository:$missing" >&2
            echo "" >&2
            echo "without the public key the binary ships with no verification" >&2
            echo "material and 'ngx update' would refuse every update;" >&2
            echo "without the private key checksums.txt ships unsigned." >&2
            echo "see docs/superpowers/plans/2026-08-17-ngx-distribution.md" >&2
            exit 1
          fi

      - name: install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: prepare the signing key
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          umask 077
          printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/minisign.key"

      # Rehearse the signature before publishing. It catches at once three
      # things that would otherwise only show up at the end of a real release:
      # the password is right, the syntax of the minisign arguments is right,
      # and -- what matters most -- the private key from the secret and the
      # public key embedded in the binary are a pair. A swapped pair would
      # produce a release that every "ngx update" refuses.
      #
      # The password goes to stdin with no trailing newline, exactly as
      # goreleaser delivers it in signs.stdin; testing it any other way would
      # not test the real path.
      - name: rehearse the signature against the published public key
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          NGX_PUBLIC_KEY: ${{ vars.NGX_PUBLIC_KEY }}
        run: |
          rehearsal="$RUNNER_TEMP/rehearsal.txt"
          printf 'ngx release %s\n' "$GITHUB_REF_NAME" > "$rehearsal"
          printf '%s' "$MINISIGN_PASSWORD" | minisign \
            -S -s "$RUNNER_TEMP/minisign.key" \
            -m "$rehearsal" -x "$rehearsal.minisig"
          minisign -V -m "$rehearsal" -x "$rehearsal.minisig" -P "$NGX_PUBLIC_KEY"

      # DD6: proves the public key REALLY reaches the binary, before publishing
      # anything.
      #
      # `-ldflags -X` against a non-existent symbol raises no error: the linker
      # ignores it, the build passes, and out comes a binary with an empty key
      # -- a "signed" release whose `ngx update` verifies no signature at all,
      # with no signal whatsoever. It already happened in this repository: the
      # target pointed at internal/output.PublicKey, which never existed.
      #
      # Looking for the key with `strings` DOES NOT work, and that was the
      # first attempt: Go writes its own ldflags into the build info section,
      # so the value shows up in the binary even when -X was ignored. The only
      # way to tell them apart is to ask the RUNNING binary, which only reports
      # `update_public_key` when the variable was actually filled in.
      - name: prove the ldflags reach the binary
        env:
          NGX_PUBLIC_KEY: ${{ vars.NGX_PUBLIC_KEY }}
        run: |
          set -eu
          pubkey_sym=github.com/s0beran0/ngx/internal/update.PublicKey
          channel_sym=github.com/s0beran0/ngx/internal/update.InstallChannel

          go build -ldflags "-X $pubkey_sym=$NGX_PUBLIC_KEY" -o /tmp/ngx-proof ./cmd/ngx
          embedded=$(/tmp/ngx-proof version --json | jq -r '.data.update_public_key // ""')
          if [ "$embedded" != "$NGX_PUBLIC_KEY" ]; then
            echo "ABORTED: the public key did not reach the binary." >&2
            echo "The -X was silently ignored -- check whether the symbol" >&2
            echo "internal/update.PublicKey still exists under that name." >&2
            echo "Publishing like this would ship a release that verifies nothing." >&2
            exit 1
          fi
          echo "public key embedded and checked in the artifact"

          # The same silent failure, one level worse, for the install channel
          # (DC1). .goreleaser.yaml compiles one build per packaged format so
          # each .deb/.rpm/.apk carries its own channel; if that -X stops
          # matching a real symbol the packages come out claiming "direct" and
          # `ngx update` overwrites a file dpkg or rpm still believes it owns.
          #
          # THIS LOOP HAS TO LIST EVERY CHANNEL .goreleaser.yaml INJECTS.
          # Adding a build there without adding it here leaves the new channel
          # as the only unproven artifact in the release, and the step stays
          # green while validating only the others.
          #
          # Kept in sync with, in .goreleaser.yaml: the builds ngx-deb,
          # ngx-rpm, ngx-apk (consumed by nfpms) and ngx-homebrew, ngx-scoop,
          # ngx-winget, ngx-aur (consumed by the archives that homebrew_casks,
          # scoops, winget and aurs publish).
          #
          # Each channel is checked twice, because the two checks fail in
          # different ways. `ngx version` reports install_channel, so it says
          # directly whether the -X landed. And the assertion is also
          # behavioural: a channel that reached the binary makes `ngx update`
          # FAIL and name the channel in the diagnostic. A -X that was ignored
          # leaves "direct", and a "direct" binary goes to the network instead
          # -- whatever it answers, it will not be the channel's name.
          for channel in deb rpm apk homebrew scoop winget aur; do
            go build \
              -ldflags "-X $pubkey_sym=$NGX_PUBLIC_KEY -X $channel_sym=$channel" \
              -o "/tmp/ngx-proof-$channel" ./cmd/ngx
            reported=$("/tmp/ngx-proof-$channel" version --json | jq -r '.data.install_channel // ""')
            if [ "$reported" != "$channel" ]; then
              echo "ABORTED: a $channel build reports install_channel=$reported." >&2
              echo "The -X against $channel_sym was silently ignored." >&2
              exit 1
            fi
            if "/tmp/ngx-proof-$channel" update --json > "/tmp/ngx-proof-$channel.json" 2>&1; then
              echo "ABORTED: a $channel build did NOT refuse to update itself." >&2
              echo "The -X against $channel_sym was silently ignored, so the" >&2
              echo ".$channel package would self-update behind its package manager." >&2
              exit 1
            fi
            message=$(jq -r '.diagnostics[0].message // ""' "/tmp/ngx-proof-$channel.json")
            case "$message" in
              *"$channel"*)
                echo "install channel $channel embedded, and it refuses to self-update"
                ;;
              *)
                echo "ABORTED: a $channel build refused, but not because of its channel." >&2
                echo "diagnostic: $message" >&2
                echo "Check whether $channel_sym still exists under that name." >&2
                exit 1
                ;;
            esac
          done

          # THE COUNTER-PROOF. Everything above shows a channel reaching the
          # binary; this shows it NOT reaching the one artifact that must not
          # carry it. A build with no -X is what the generic tarball, and a
          # plain `go build`, are -- and if it ever came out as anything but
          # "direct", `curl | sh` would install a binary that refuses to update
          # itself on a machine with no package manager to update it.
          plain=$(/tmp/ngx-proof version --json | jq -r '.data.install_channel // ""')
          if [ "$plain" != "direct" ]; then
            echo "ABORTED: a build with no channel flag reports $plain." >&2
            echo "The tarball install.sh delivers would refuse to self-update." >&2
            exit 1
          fi
          echo "a build with no channel flag stays direct"

      # Which self-service channels this release will actually push to.
      #
      # The credentials for the tap, the scoop bucket, the winget fork and the
      # AUR live outside this repository -- secrets.GITHUB_TOKEN reaches none
      # of them -- and a missing one makes goreleaser generate the manifest
      # without publishing it (see skip_upload in .goreleaser.yaml). That is
      # deliberate: an absent AUR account must not block a release. But a
      # channel skipped in silence is a channel nobody notices is stale, so it
      # gets said out loud here.
      - name: report which channels will publish
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          report() {
            if [ -n "$2" ]; then
              echo "- $1: WILL PUBLISH"
            else
              echo "- $1: skipped, secret $3 is not set (docs/install-channels.md)"
            fi
          }
          {
            echo "### Self-service channels"
            echo ""
            report "homebrew tap (s0beran0/homebrew-tap)" "$HOMEBREW_TAP_TOKEN" HOMEBREW_TAP_TOKEN
            report "scoop bucket (s0beran0/scoop-bucket)" "$SCOOP_BUCKET_TOKEN" SCOOP_BUCKET_TOKEN
            report "winget pull request (microsoft/winget-pkgs)" "$WINGET_PKGS_TOKEN" WINGET_PKGS_TOKEN
            report "aur (ngx-bin)" "$AUR_SSH_KEY" AUR_SSH_KEY
            echo ""
            echo "The .deb/.rpm/.apk and the tarballs do not depend on any of these."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          MINISIGN_KEY_FILE: ${{ runner.temp }}/minisign.key
          # A variable, not a secret: the public key is public by definition.
          # The build embeds this value in the binary (DD3).
          NGX_PUBLIC_KEY: ${{ vars.NGX_PUBLIC_KEY }}
          # One credential per destination repository, because a fine-grained
          # PAT is scoped to repositories and none of these is this one. All
          # four are OPTIONAL: goreleaser reads them through envOrDefault and
          # skips the upload when they are empty, so a release still goes out
          # complete for every other channel. See docs/install-channels.md for
          # how each one is created.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

      # The release is already published when this step runs; it does not
      # prevent the error, only makes sure it does not go unnoticed. The
      # rehearsal above is what prevents it.
      - name: check the published signature
        env:
          NGX_PUBLIC_KEY: ${{ vars.NGX_PUBLIC_KEY }}
        run: |
          minisign -V -m dist/checksums.txt \
            -x dist/checksums.txt.minisig -P "$NGX_PUBLIC_KEY"

      # Without this, the private key would stay on the runner's disk until the
      # machine is recycled.
      - name: wipe the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/minisign.key"
