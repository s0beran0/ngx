name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push on the same ref cancels the previous run: its result no longer
# matters and the runner is freed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The binary is distributed statically. Pinning it here keeps any job from
  # forgetting it.
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # The version comes from .tool-versions, the same file asdf uses on the
      # developer's machine. Duplicating the number here would let CI and the
      # local environment diverge without anyone noticing.
      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: true

      - name: formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt pending on the files:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # The integration tests sit behind the `integration` build tag and do
      # not run here, so NOTHING was compiling them -- and code that is never
      # compiled accuses nothing. It already happened: a translation changed
      # messages in hostkey.go and the integration assertions kept comparing
      # the old text, with no job ever turning red. They broke the next time
      # someone brought the bench up, far from the change that broke them.
      #
      # `vet` with the tag compiles and analyses those files without needing
      # Docker: it costs seconds and closes the hole.
      - name: vet of the integration tests
        run: go vet -tags integration ./...

      # The race detector requires cgo; it is the only exception to
      # CGO_ENABLED=0, and it holds only for running the tests, never for the
      # distributed binary.
      - name: tests with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -count=1

      # A dependency that required cgo would break the cross-compile, and the
      # error would only show up at release time.
      - name: build without cgo
        run: go build ./...

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzAlignment, FuzzTokenizeSpans]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: true

      # Fixed, short time, never unbounded: fuzz with no ceiling has already
      # burned the budget in this project. The goal here is catching an obvious
      # regression; a long campaign is run by hand.
      - name: fuzz ${{ matrix.target }} for 60s
        run: >
          go test ./internal/config
          -run '^$'
          -fuzz '^${{ matrix.target }}$'
          -fuzztime=60s

      # The corpus fuzz generates when it finds a failure does not show up in
      # the log; without this, a finding by CI is irreproducible.
      - name: keep the failure corpus
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: internal/config/testdata/fuzz/
          if-no-files-found: ignore

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: true

      - name: compile for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/ngx

  # OFF UNTIL SOMEONE TURNS IT ON, but READY.
  #
  # The tests behind the `integration` build tag exercise the remote path
  # against the bench (`make bench-up`: a docker container with sshd and
  # nginx). The remote code is complete and the suite passes on this machine;
  # what is missing is only the decision to spend runner minutes building the
  # image on every push.
  #
  # It stays behind a variable out of honesty: it has never run on a GitHub
  # runner, and turning it on from outside the repository breaks nobody, while
  # turning it on in a commit would land CI in red with no one able to test it
  # first.
  #
  # The switch is the repository variable NGX_CI_INTEGRATION: while it does
  # not exist (or is not "1"), the job is skipped. To turn it on, just run
  # `gh variable set NGX_CI_INTEGRATION --body 1` -- no commit needed. Until
  # then, run it by hand: `make bench-up && go test ./... -tags integration`.
  integration:
    if: vars.NGX_CI_INTEGRATION == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: true

      - name: bring the bench up
        run: make bench-up

      - name: bench smoke test
        run: make bench-smoke

      - name: integration tests
        env:
          CGO_ENABLED: "1"
        run: go test ./... -tags integration -race -count=1

      # Tears it down even if the tests fail: the next job on the same runner
      # must not inherit a container or a test key.
      - name: tear the bench down
        if: always()
        run: make bench-down
